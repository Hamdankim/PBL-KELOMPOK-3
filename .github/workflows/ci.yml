name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: |
          cd my-app
          npm ci
      - name: Run tests
        run: |
          cd my-app
          npm test

  build:
    name: Build app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: |
          cd my-app
          npm ci
      - name: Build
        run: |
          cd my-app
          npm run build

  docker-build:
    name: Docker build (artifact)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image
        run: |
          docker build -f my-app/Dockerfile -t smart-irrigation:${{ github.sha }} my-app
      - name: Save image as artifact
        run: |
          docker save smart-irrigation:${{ github.sha }} -o image.tar
        continue-on-error: false
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
